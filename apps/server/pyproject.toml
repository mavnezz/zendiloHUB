[project]
name = "zendilohub-server"
version = "0.1.0"
description = "zendiloHUB API and workers."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13",
    "argon2-cffi>=25.1.0",
    "cryptography>=50",
    "fastapi>=0.161.0",
    "nh3>=0.3",
    "psycopg[binary,pool]>=3.3.6",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
zendilohub = "zendilohub.main:main"


[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["zendilohub"]
branch = true
# Process bootstrap only (signals, uvicorn); everything it calls is tested.
omit = ["*/zendilohub/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", '\.\.\.$']

[tool.uv.build-backend]
module-name = "zendilohub"
